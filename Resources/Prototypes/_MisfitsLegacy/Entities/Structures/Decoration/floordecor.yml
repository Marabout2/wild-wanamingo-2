# Ported from Resources/Prototypes/Entities/Structures/Decoration/floordecor.yml in wild-wanamingo.

- type: entity
  id: DecorFloorBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Decoration/cave_decor.rsi
    netsync: false
    noRot: true
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
# No fixture on this base, inherit from further down for fixture

# Cave Decor

- type: entity
  parent: DecorFloorBase
  id: DecorFloorWorldBase
  abstract: true
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Decoration/world.rsi

- type: entity
  parent: DecorFloorWorldBase
  id: DecorFloorBrickrubble
  name: brick rubble
  description: brick rubble
  suffix: "6 states"
  components:
  - type: Sprite
    state: brickrubble
