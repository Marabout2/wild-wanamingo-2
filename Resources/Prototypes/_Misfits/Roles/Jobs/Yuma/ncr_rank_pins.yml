# NCR rank pins for Yuma, handed over at spawn by hours played in the job (a step every 20 hours, like
# Misfits). Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Misfits/NCR/ncr_rank_pin_progressions.yml; ranges from the server roster.

- type: ncrRankPinProgression
  id: F14NCRCommanderRankPins
  jobs:
  - NCRCommander
  tracker: NCRCommander
  thresholds:
  - min: 0 # 0 hours
    entity: ClothingNeckPinNCRSecondLieutenant
  - min: 72000 # 20 hours
    entity: ClothingNeckPinNCRFirstLieutenant
  - min: 144000 # 40 hours
    entity: ClothingNeckPinNCRCaptain

