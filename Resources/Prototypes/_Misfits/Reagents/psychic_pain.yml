# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Reagents/psychic_pain.yml

- type: reagent
  id: MisfitsClearhead
  name: reagent-name-misfits-clearhead
  group: Wasteland
  desc: reagent-desc-misfits-clearhead
  physicalDesc: reagent-physical-desc-clear
  flavor: medicine
  color: "#dbe8e8"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      # Entry-level psychiatric stabilizer.
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 6
        type: Remove
      # TODO C#: SuppressHallucinationsReagent
      # suppression: 0.20
      # duration: 8
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: MisfitsClearhead
          min: 25
        damage:
          types:
            Poison: 0.25
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        conditions:
        - !type:ReagentCondition
          reagent: MisfitsClearhead
          min: 25
        time: 2
        type: Add

