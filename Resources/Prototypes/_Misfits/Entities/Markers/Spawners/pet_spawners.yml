# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Markers/Spawners/pet_spawners.yml

- type: entity
  id: MisfitsPetSpawnerBase
  name: pet spawner
  abstract: true
  components:
