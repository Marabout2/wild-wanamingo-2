# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Hydroponics/seeds.yml

- type: entity
  parent: SeedBase
  id: LemonadeSeeds
  name: packet of lemonade seeds
  description: Not to be confused with the drink.
  components:
  - type: Seed
    plantId: Lemonade
  - type: Sprite
    sprite: Misfits/Objects/Specific/Hydroponics/lemonade.rsi

- type: entity
  parent: SeedBase
  id: CocaSeeds
  name: packet of coca seeds
  components:
  - type: Seed
    plantId: CocaPlant
  - type: Sprite
    sprite: Misfits/Objects/Specific/Hydroponics/coca_plant.rsi

- type: entity
  parent: SeedBase
  id: CoconutSeeds
  name: packet of coconut seeds
  components:
  - type: Seed
    plantId: CoconutPlant
  - type: Sprite
    sprite: Misfits/Objects/Specific/Hydroponics/coconut.rsi

- type: entity
