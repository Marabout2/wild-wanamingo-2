# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/_Misfits/Entities/Objects/Specific/Kits/UndecidedLoadout.yml

- type: entity
  id: LegionPriestessLoadoutKits
  name: kit
  description: "please only take one."
  parent: LegionCenturionloadoutkits
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    toolName: n14-loadout-kit-window-title
    toolDesc: n14-loadout-kit-window-description
    possibleSets:
    - PriestessHealingSet
    - PriestessZealotSet
    - PriestessPurifierSet

- type: thiefBackpackSet
  id: PriestessHealingSet
  name: n14-loadout-kit-priestesshealingset-name
  description: n14-loadout-kit-priestesshealingset-description
  sprite:
    sprite: Misfits/Legacy/Corvax/Objects/Misc/kits.rsi
    state: base
  content:
  - KitPriestessHealing

