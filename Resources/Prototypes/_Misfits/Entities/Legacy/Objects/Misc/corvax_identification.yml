# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/Corvax/Entities/Objects/Misc/identification.yml
# (Misfits' copy of a Space Station 14 or other-fork file.)

- type: entity
  parent: N14IDPassportBlank
  id: N14IDLegionaryBadge
  name: distinctive sign
  description: "The sign of the red bull."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Objects/Misc/identification.rsi
    state: sign
  - type: IdCard # #Misfits Add - display "medallion" instead of default "ID card"
    nameLocId: n14-id-medallion-name
    fullNameLocId: n14-id-medallion-full-name
  - type: PresetIdCard
    job: CaesarLegionAuxilia
  #Misfits Add - IdCardLegion enables this badge to appear on the Centurion's tactical map terminal
  - type: Tag
    tags:
    - IdCardLegion

