- type: entity
  parent: N14FalloutArmorBase
  id: N14ClothingOuterDeanLegionnaireVeteranArmor
  #Misfits Change /Fix:/ corrected malformed component list indentation.
  name: heavy legionary armor
  description: "The heavy version of legionary armor slows down the wearer, but gives good protection from external threats."
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Corvax/Clothing/OuterClothing/Armor/deanveteranarmor.rsi
  - type: Clothing
    sprite: Misfits/Legacy/Corvax/Clothing/OuterClothing/Armor/deanveteranarmor.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.95 # This should not be straight worse than Prime. Many picked Prime over Veteran because of this.
    sprintModifier: 0.95
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.60
        Slash: 0.60
        Piercing: 0.55 # Billy again. This shit is for veteran decani. 35% with 10% slow? you fuckin kidding me? buff to 45%.
        Heat: 0.60 # legion should not have heat protection over Blunt/slash. >:(
                   # BUT WHAT IF IT DID ANYWAY? -tytos
  - type: ExplosionResistance
    damageCoefficient: 0.65
#  - type: ClothingSpecialModifier
#    strengthModifier: 2

