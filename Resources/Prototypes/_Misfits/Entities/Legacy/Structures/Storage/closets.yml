# Ported from Misfits (https://github.com/Misfit-Sanctuary/nuclear-14): Resources/Prototypes/Entities/Structures/Storage/closets.yml
# (Misfits' copy of a Space Station 14 or other-fork file.)

- type: entity
  parent: ClosetBase
  id: ClosetBase2
  abstract: true
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Storage/Closets/closet.rsi
    layers:
    - state: closet
      map: ["enum.StorageVisualLayers.Base"]
    - state: closet_door
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: closet
    stateDoorOpen: closet_open
    stateDoorClosed: closet_door
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Anchorable # Makes the anchoring near impossible due to high time requirement
    delay: 3600

- type: entity
  parent: ClosetBase2
  id: ClosetBaseW
  name: closet
  description: A basic closet for storing things.
  components:
  - type: Weldable
  - type: Sprite
    noRot: true
    netsync: false
    sprite: Misfits/Legacy/Structures/Storage/Closets/closet.rsi
    layers:
    - state: closet
      map: ["enum.StorageVisualLayers.Base"]
    - state: closet_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: closet
    stateDoorOpen: closet_open
    stateDoorClosed: closet_door

- type: entity
  parent: ClosetBaseW
  id: ClosetRusty
  name: rusty closet
  description: A rusty old closet for storing things.
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Storage/Closets/closetold.rsi

- type: entity
  parent: ClosetBaseW
  id: ClosetFridgeWideDirty
  name: fridge
  description: A dirty old fridge for keeping food fresh
  components:
  - type: Sprite
    sprite: Misfits/Legacy/Structures/Storage/Closets/fridgewidedirty.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: AntiRottingContainer
