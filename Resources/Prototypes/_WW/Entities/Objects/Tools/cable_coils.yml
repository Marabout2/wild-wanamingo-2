# Wizden cable coils with Mojave Sun 13's wire coil icons; they lay the F14 cables.
# They keep Wizden's stack types (CableHV, CableMV, Cable) so construction recipes that need cable accept them.
# Held sprites are still Wizden's: MS13 has no in-hand sprites for wire.

- type: entity
  parent: CableHVStack
  id: F14CableHVStack
  name: HV cable coil
  suffix: Full
  description: Thick red wire for connecting generators to heavy machinery and substations.
  components:
  - type: Sprite
    sprite: MojaveSun/Objects/Tools/cable_coils.rsi
    state: redwire_3
    layers:
    - state: redwire_3
      map: ["base"]
  - type: Stack
    layerStates:
    - redwire
    - redwire_2
    - redwire_3
  - type: CablePlacer
    cablePrototypeID: F14CableHV

- type: entity
  parent: F14CableHVStack
  id: F14CableHVStack10
  suffix: 10
  components:
  - type: Sprite
    state: redwire_2
  - type: Stack
    count: 10

- type: entity
  parent: F14CableHVStack
  id: F14CableHVStack1
  suffix: 1
  components:
  - type: Sprite
    state: redwire
  - type: Stack
    count: 1

