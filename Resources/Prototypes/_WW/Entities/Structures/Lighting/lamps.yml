    sprite: MojaveSun/Structures/Lighting/lamps.rsi
    layers:
    - state: handmadelamp
      map: [ "base" ]
    - state: handmadelamp_on
      map: [ "light" ]
  - type: Icon
    sprite: MojaveSun/Structures/Lighting/lamps.rsi
    state: handmadelamp
  - type: Item
    sprite: Objects/Misc/Lights/lamp.rsi

- type: entity
  parent: BaseLamp
