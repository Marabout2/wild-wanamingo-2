# Mojave Sun 13 sprites on copies of Misfits/N14 prototypes (Wizden ones where N14 has none).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  parent: Poweredlight
  id: F14PoweredLightTube
  name: light
  components:
  - type: Sprite
    sprite: MojaveSun/Structures/Wallmounts/Lighting/lighting.rsi
    offset: 0, 0
    noRot: false
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: light_tube
    - map: ["enum.PoweredLightLayers.Glow"]
      sprite: MojaveSun/Structures/Wallmounts/Lighting/lighting_overlay.rsi
      state: light_tube
      shader: unshaded
  - type: Icon
    sprite: MojaveSun/Structures/Wallmounts/Lighting/lighting.rsi
    state: light_tube
  - type: PoweredLightVisuals
    spriteStateMap:
      empty: light_tube-empty
      off: light_tube
      on: light_tube
      broken: light_tube-broken
      burned: light_tube-burned
  - type: PoweredLight
    hasLampOnSpawn: F14LightTube

