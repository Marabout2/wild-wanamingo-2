# Mojave Sun 13 sprites on copies of Misfits/N14 prototypes (Wizden ones where N14 has none).
# Sprites: Resources/Textures/MojaveSun (CC-BY-NC-SA-3.0, Mojave Sun 13).

- type: entity
  abstract: true
  parent: BaseStructure
  id: F14DecorMachineBase
  components:
  - type: Sprite
    noRot: false
    snapCardinals: false
  - type: Transform
    noRot: false
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: F14DecorMachineBase
  id: F14IVDrip
  name: IV drip
  description: A stand for hanging IV bags.
  components:
  - type: Sprite
    sprite: MojaveSun/Structures/Machines/Medical/medical.rsi
    state: iv_drip
  - type: Icon
    sprite: MojaveSun/Structures/Machines/Medical/medical.rsi
    state: iv_drip

