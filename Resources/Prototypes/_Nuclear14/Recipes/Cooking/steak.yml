- type: constructionGraph
  id: MeatSteakBrahmin
  start: start
  graph:
  - node: start
    edges:
    - to: SteakCooked
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 335 # WW: was 305 K (32 C), Wizden red meat temperature
  - node: SteakCooked
