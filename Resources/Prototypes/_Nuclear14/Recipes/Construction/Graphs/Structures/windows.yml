- type: constructionGraph
  id: N14WindowBars
  start: start
  graph:
    - node: start
      edges:
        - to: bars
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1

    - node: bars
      entity: N14WindowBars
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Cutting
              doAfter: 1
