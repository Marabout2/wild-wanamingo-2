- type: entity
  parent: BaseItem
  id: N14MaterialBaseHide
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/mob_drops.rsi
    state: hide_brahmin
  - type: Tag
    tags:
      - RawLeather
  - type: PhysicalComposition
    materialComposition:
      RawLeather: 400
  - type: Material
  - type: Item
    size: Normal
  # - type: Craftable # Corvax-Change  # #Misfits Remove: Stalker14 crafting system

- type: entity
