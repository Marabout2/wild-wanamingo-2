- type: entity
  parent: BaseHealingItem
  id: N14Bandage #! Corvax-Change
  name: bandage
  description: A long strip of cloth which can stop bleeding. Mostly sterile.
  suffix: full
  components:
  - type: Tag
    tags:
    - N14Bandage
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: bandage
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Heat: -0.5
        Shock: -0.5
        Cold: -0.5
        Caustic: -0.5
        Slash: -10
        Piercing: -15
    bloodlossModifier: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: N14Bandage
    count: 15 #Was 10, Buffed due to limb damage changes
  - type: StackPrice
    price: 2 # Corvax-Change

- type: entity
  parent: N14Bandage
  id: N14Bandage1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  name: aloe salve
  description: Used to treat those nasty burns. Less effective on caustic burns.
  parent: Ointment
  id: N14AloeSalve
  suffix: Full
  components:
  - type: Stack
    stackType: N14AloeSalve
    count: 10
    baseLayer: base
    layerStates:
    - aloe1
    - aloe2
    - aloe3
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    layers:
    - state: aloe3
      map: ["base"]

- type: entity
  id: N14AloeSalve1
  parent: N14AloeSalve
  suffix: Single
  components:
  - type: Stack
    stackType: N14AloeSalve
    count: 1
  - type: Sprite
    state: aloe1
