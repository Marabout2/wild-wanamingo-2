#MARK: RadAway Inhaler

- type: entity
  parent: N14ChemicalSyringe
  id: N14RadAwayInhalerBase
  name: RadAway inhaler
  description: A jet inhaler with a RadAway phial screwed on top of it. Three puffs away from being rad free.
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/radinhaler.rsi
    netsync: false
    layers:
    - state: radawayinhaler1
      map: ["enum.SolutionContainerLayers.Fill"]
    - state: radawayinhaler
    - state: radawayinhaler_text
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    changeColor: true
    fillBaseName: radawayinhaler
    emptySpriteName: radawayinhaler
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    ignoreClosed: false
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: BaseBeaker
  id: N14RadAwayPhialBase
  name: RadAway phial
  description: A coloured phial containing RadAway. This one appears to be empty.
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Specific/Medical/radinhaler.rsi
    layers:
      - state: radawayphial1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: radawayphial
      - state: radawayphial_text
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    changeColor: true
    fillBaseName: radawayphial
  - type: Item
    size: Tiny
  - type: ToolRefinable
    refineResult:
    - id: SheetGlass1
  - type: PhysicalComposition
    materialComposition:
      Glass: 50
  - type: StaticPrice # Forge-Add
    price: 1

