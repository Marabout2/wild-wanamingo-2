# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Specific/Hydroponics/leaves.yml

- type: entity
  name: dried cannabis leaves
  parent: LeavesCannabisDried
  id: N14LeavesCannabisDried
  components:
    - type: Stack
      stackType: N14LeavesCannabisDried
      count: 1
    - type: Sprite
      sprite: Nuclear14/Objects/Consumable/Smokeables/smokeables.rsi
      state: cannabis_dried
   

# Copied full vanilla code just so my sprite wasn't black

- type: entity
  name: ground cannabis
  parent: BaseItem
  id: N14GroundCannabis
  description: "Ground cannabis, ready to take you on a trip."
  components:
    - type: Stack
      stackType: N14GroundCannabis
      count: 1
    - type: Solution
      solution:
        reagents:
          - ReagentId: THC
            Quantity: 20
    - type: Sprite
      sprite: Nuclear14/Objects/Consumable/Smokeables/smokeables.rsi
      state: cannabis_powderpile
    - type: Tag
      tags:
        - Smokable
    - type: Item
      size: Tiny
      

- type: entity
  name: dried tobacco leaves
  parent: LeavesTobaccoDried
  id: N14LeavesTobaccoDried
  components:
    - type: Stack
      stackType: N14LeavesTobaccoDried
      count: 1
    - type: Sprite
      sprite: Nuclear14/Objects/Consumable/Smokeables/smokeables.rsi
      state: tobacco_dried_1
   

- type: entity
  name: ground tobacco
  parent: GroundTobacco
  id: N14GroundTobacco
  components:
    - type: Stack
      stackType: N14GroundTobacco
      count: 1
    - type: Sprite
      sprite: Nuclear14/Objects/Consumable/Smokeables/smokeables.rsi
      state: tobacco_powderpile
    
