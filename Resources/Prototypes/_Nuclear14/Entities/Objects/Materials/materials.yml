- type: entity
  abstract: true
  parent: MaterialBase
  id: N14MaterialBase
  description: A raw material.
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Misc/materials.rsi
  - type: Material
  - type: Appearance
  # - type: Craftable # Corvax-Change  # #Misfits Remove: Stalker14 crafting system

- type: entity
  parent: N14MaterialBase
  id: N14MaterialBasePowder
  abstract: true
  components:
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: powder_lead
  - type: ExaminableSolution
    solution: powder
  - type: Extractable
    grindableSolutionName: powder

# Other
#MARK: Gunpowder

- type: entity
  parent: N14MaterialBasePowder
  id: SulfurPowder
  name: sulfur
  categories: [ HideSpawnMenu ]
  components:
  - type: PhysicalComposition
    materialComposition:
      Sulfur: 100
  - type: Stack
    stackType: Sulfur
    baseLayer: powder_brass
  - type: Sprite
    sprite: /Textures/Nuclear14/Objects/Misc/materials.rsi
    state: powder_brass
    layers:
    - state: powder_brass
      map: ["base"]
  - type: Item
    heldPrefix: powder_brass
  - type: SolutionContainerManager
    solutions:
      powder:
        reagents:
        - ReagentId: Sulfur
          Quantity: 10
  - type: StaticPrice # Forge-Change
    price: 1 # PH

- type: entity
  parent: SulfurPowder
  id: SulfurPowder1
  suffix: Single
  components:
  - type: Stack
    count: 1

