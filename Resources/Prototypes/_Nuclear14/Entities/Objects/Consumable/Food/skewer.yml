# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Consumable/Food/skewer.yml

- type: entity
  name: meat kebab
  parent: FoodKebabSkewer
  id: N14CookedFoodMeatKebab
  description: Three chunks of wasteland meat on a skewer.
  components:
  - type: Edible
    edible: Food
    trash:
    - FoodKebabSkewer
  - type: FlavorProfile
    flavors:
    - meaty
  - type: Sprite
    layers:
    - state: skewer
    - state: skewer-meat
    # #Misfits Fix - removed greyscale alpha overlay and empty foodSequenceLayers map;
    # those are for dynamically assembled food sequences, not pre-made static kebabs
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 12
      - ReagentId: Protein
        Quantity: 6
      - ReagentId: Vitamin
        Quantity: 2
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodMeatSnakeKebab
  id: N14FoodMeatSnakeKebab
