# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Throwable/grenades.yml

- type: entity
  abstract: true
  parent: BaseItem
  id: IgnitableGrenadeBase
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: Appearance
  - type: AnimationPlayer
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: ExplodeOnTrigger
  - type: Flammable
    fireSpread: false
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: false 
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
    normalState: primed

- type: entity
  name: dynamite
  description: A stick of dynamite that produces a broad, powerful pressure wave without fragmentation.
  parent: IgnitableGrenadeBase
  id: N14Dynamite
  components:
  - type: Explosive
    # #Misfits Change - broad pure blast: 6 intensity produces 60 blunt and 30
    # heat at the epicenter, with no piercing or spawned fragmentation.
    explosionType: MisfitsDynamite
    maxIntensity: 6
    intensitySlope: 5
    totalIntensity: 100
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 4
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 7
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 13
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:TriggerBehavior

    

- type: entity #should spawn fire only when it was activated and then thrown, but when its not activated it just breaks and spills welding fuel. 
  name: Nuka cocktail
  description: Nuka-Cola bottle filled with flammable fuel.
  parent: IgnitableGrenadeBase
  id: N14NukaCocktail
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/NukaCocktail.rsi  
  - type: ExplodeOnTrigger
  - type: Explosive # Weak explosion in a small/medium radius. Ignites surrounding entities.
    explosionType: FireBomb
    maxIntensity: 2
    intensitySlope: 9
    totalIntensity: 30
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: DamageOnLand
    damage:
      types:
        Blunt: 20
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound: "/Audio/Nuclear14/Weapons/Effects/Wpn_dynam_fuse.ogg" 
    - trigger:
        !type:DamageGroupTrigger  
        damageGroup: Burn 
        damage: 20
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageTrigger # either was thrown ([1 * time] burn damage + 20 brute) or burned too long (21 burn damage)
        damage: 21
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageGroupTrigger #20 brute damage which means wasnt set on fire, so no reason to set on fire, it should only splash some welding fuel
        damageGroup: Brute 
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FireVisuals
    sprite: Nuclear14/Objects/Weapons/Grenades/NukaCocktail.rsi
    normalState: primed
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 30
  - type: Spillable
    solution: drink

- type: entity
  parent: GrenadeBase
  id: N14Firecracker
  name: firecracker
  description: POP POP!
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Grenades/Firecracker.rsi  
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 1
    intensitySlope: 5
    totalIntensity: 5 # should be about 1 tile max very small damage
    canCreateVacuum: false
    maxTileBreak: 0
    tileBreakScale: 0
  - type: DamageOnLand
    damage:
      types:
        Blunt: 3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/snap.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
