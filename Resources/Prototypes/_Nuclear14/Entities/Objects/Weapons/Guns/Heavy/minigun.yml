# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Objects/Weapons/Guns/Heavy/minigun.yml

- type: entity
  name: minigun
  parent: BaseItem
  id: BaseWeaponMinigun
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
    size: Ginormous
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Misfits/Legacy/Weapons/spinon.ogg
    soundDeactivate:
      path: /Audio/Misfits/Legacy/Weapons/spinoff.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Misfits/Legacy/Weapons/spinloop.ogg
  - type: UseDelay
    delay: 1.5
  - type: Clothing
    sprite: Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    minAngle: 2
    maxAngle: 12
    angleIncrease: 2
    angleDecay: 12
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: N14MinigunGunshot
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14MagazineMinigun5mm
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - N14MagazineMinigun5mm
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol5
        priority: 1
        whitelist:
          tags:
            - N14CartridgePistol5
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: MultiHandedItem
  - type: HeldSpeedModifier
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: StaticPrice
    price: 500
  - type: Execution
  - type: MeleeWeapon
    attackRate: 1.3333
    damage:
      types:
        Blunt: 8.5
    bluntStaminaDamageFactor: 1.25
    animation: WeaponArcThrust
    wideAnimationRotation: 180
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2.5
