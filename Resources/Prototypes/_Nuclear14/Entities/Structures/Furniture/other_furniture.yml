# Washroom

- type: entity
  parent: N14DecorFloorBase
  id: N14Shower
  name: shower
  description: Wash off that scum...wait, then there would be nothing left.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/world.rsi
    snapCardinals: false
    state: shower
    # drawdepth: Overdoors
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg

- type: entity
  parent: SeatBase
  id: N14Toilet
  name: toilet
  description: Waste not, want not
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Decoration/world.rsi
    state: toilet
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg
  - type: SecretStash
    secretStashName: secret-stash-toilet
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 500
      toilet:
        maxVol: 250
  - type: DumpableSolution
    solution: drainBuffer

- type: entity
  parent: N14Shower
  id: N14Sink
  name: sink
  description: Waste not, want not
  components:
  - type: Sprite
    state: sink
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 100
      tank:
        maxVol: 200
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: DumpableSolution
    solution: drainBuffer
