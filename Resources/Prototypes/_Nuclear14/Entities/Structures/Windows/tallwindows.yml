- type: entity
  parent: BaseStructure
  id: N14WindowTallBase
  name: window frame
  abstract: true
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Windows/tallwallwindows.rsi
    noRot: true
    drawdepth: Walls
  - type: Icon
    sprite: Nuclear14/Structures/Windows/tallwallwindows.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: PlacementReplacement
    key: walls
  - type: Climbable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        mask:
        - TableMask
        layer:
        - TableLayer

