# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Structures/Machines/terminals.yml

- type: entity
  id: N14ComputerTerminalBase
  parent: BaseStructure
  name: terminal frame
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.10,0.10,0.10"
        density: 500
        mask:
          - TabletopMachineMask
  - type: Rotatable
  - type: Anchorable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: Broken
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Nuclear14/Structures/Machines/Terminals/terminal_new.rsi
    state: frame

- type: entity
  parent: N14ComputerTerminalBase
  id: N14ComputerTerminalNewBroken
  suffix: new
  name: broken terminal
  description: A computer terminal. This one looks broken.
  components:
  - type: Sprite
    state: broken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          N14ScrapGold1:
           min: 1
           max: 3
          N14ScrapElectronic1:
           min: 2
           max: 5
          N14ScrapSteel1:
           min: 3
           max: 6

- type: entity
  parent: N14ComputerTerminalBase
  id: N14ComputerTerminalNewWired
  components:
  - type: Sprite
    sprite: Nuclear14/Structures/Machines/Terminals/terminal_new.rsi
    state: wired

