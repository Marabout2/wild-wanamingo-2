# Ported from Nuclear 14 (https://github.com/Vault-Overseers/nuclear-14) via Misfits (https://github.com/Misfit-Sanctuary/nuclear-14):
# Resources/Prototypes/_Nuclear14/Entities/Mobs/NPCs/lizards.yml

- type: entity
  name: gecko
  id: N14MobGecko
  parent: N14MobBaseHostileScaley
  description: Looks like a dinosaur. The bite is worse than the claws.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: gecko
      sprite: Nuclear14/Mobs/Animals/gecko.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed : 4                         # Forge-Change
    baseSprintSpeed : 5                       # Forge-Change
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.3
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      130: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gecko
      Critical:
        Base: gecko
      Dead:
        Base: dead
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    soundHit:
      collection: N14GeckoAttack #Misfits Change
    angle: 60
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    damage:
      types:
        Slash: 8                        # Forge-Change
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: N14GeckoIdle
      params:
        volume: -10
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: N14GeckoAttack
      params:
        volume: -3
        maxDistance: 10
  - type: Butcherable
    spawned:
    - id: N14FoodMeatGecko
      amount: 3
    - id: N14MaterialHideGecko
      amount: 1
  #- type: Reproductive
    #breedChance: 0.05
    #birthPopup: reproductive-laid-egg-popup
    #makeOffspringInfant: false
    #partnerWhitelist:
      #tags:
      #- Gecko
    #offspring:
    # id: N14FoodEggGeckoFertilized
     #maxAmount: 3
 #- type: ReproductivePartner
 #- type: EggLayer
   #eggSpawn:
   #- id: N14FoodEggGecko
#- type: Tag
   # tags:
    #- Gecko

