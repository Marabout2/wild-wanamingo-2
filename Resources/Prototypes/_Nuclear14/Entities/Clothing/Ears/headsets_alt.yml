# #Misfits Add — Followers of the Apocalypse headset; grants both faction and wasteland channels

- type: entity
  parent: N14ClothingHeadsetLightScribe
  id: N14ClothingHeadsetFollowers
  name: Followers radio headset
  components:
  - type: Item
    heldPrefix: off
    size: Small
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyFollowers
      - EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keysUnlocked: false
  - type: Sprite
    sprite: Misfits/Clothing/Ears/Headsets/followerslight.rsi
    layers:
    - state: icon
    - state: light-icon
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: Misfits/Clothing/Ears/Headsets/followerslight.rsi
    equippedPrefix: off
